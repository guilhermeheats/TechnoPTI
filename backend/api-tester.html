<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Tester — Prog. Linear</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0f; --surface: #16161a; --surface2: #1e1e24; --border: #2a2a33;
    --accent: #7c6af7; --accent2: #4ecdc4; --danger: #f25757; --success: #52d68a;
    --warn: #f5a623; --text: #e8e8f0; --muted: #6b6b80;
    --mono: 'JetBrains Mono', monospace; --sans: 'Syne', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; min-height: 100vh; display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 56px 1fr; height: 100vh; overflow: hidden; }
  header { grid-column: 1 / -1; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 16px; }
  header h1 { font-family: var(--sans); font-size: 15px; font-weight: 800; letter-spacing: -0.3px; }
  .tag { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.5px; }
  .mem-badge { margin-left: auto; font-size: 11px; color: var(--warn); background: #2a2a1a; padding: 3px 10px; border-radius: 5px; }
  .base-url-wrapper { display: flex; align-items: center; gap: 8px; margin-left: 12px; }
  .base-url-wrapper label { color: var(--muted); font-size: 11px; }
  .base-url-wrapper input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 12px; padding: 5px 10px; border-radius: 6px; width: 200px; outline: none; }
  .base-url-wrapper input:focus { border-color: var(--accent); }
  aside { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px 0; }
  .section-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; padding: 12px 16px 6px; }
  .route-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 16px; background: none; border: none; cursor: pointer; text-align: left; color: var(--text); font-family: var(--mono); font-size: 12px; transition: background 0.12s; border-left: 2px solid transparent; }
  .route-btn:hover { background: var(--surface2); }
  .route-btn.active { background: var(--surface2); border-left-color: var(--accent); color: #fff; }
  .method { font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 4px; min-width: 36px; text-align: center; letter-spacing: 0.3px; }
  .GET    { background: #1a3a2a; color: var(--success); }
  .POST   { background: #2a2a1a; color: var(--warn); }
  .DELETE { background: #3a1a1a; color: var(--danger); }
  main { display: grid; grid-template-rows: 1fr 1fr; overflow: hidden; }
  .panel { padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .panel-title { font-family: var(--sans); font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .request-line { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; flex-shrink: 0; }
  .req-method { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 5px; min-width: 48px; text-align: center; }
  .req-url { flex: 1; background: none; border: none; color: var(--text); font-family: var(--mono); font-size: 13px; outline: none; }
  .send-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 7px 18px; cursor: pointer; transition: opacity 0.15s, transform 0.1s; letter-spacing: 0.5px; }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .desc-box { background: var(--surface2); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 0 6px 6px 0; color: var(--muted); font-size: 12px; line-height: 1.6; flex-shrink: 0; }
  .field-group { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .field-group label { font-size: 11px; color: var(--muted); font-weight: 500; }
  .field-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .field-row input { flex: 1; min-width: 120px; }
  input[type=number], textarea { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 12px; padding: 7px 10px; border-radius: 6px; outline: none; width: 100%; transition: border-color 0.15s; }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
  .response-panel { border-top: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  .response-header { display: flex; align-items: center; gap: 12px; padding: 10px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .status-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 5px; display: none; }
  .status-2xx { background: #1a3a2a; color: var(--success); display: inline-block; }
  .status-4xx, .status-5xx { background: #3a1a1a; color: var(--danger); display: inline-block; }
  .response-time { color: var(--muted); font-size: 11px; }
  .response-body { flex: 1; overflow-y: auto; padding: 16px 24px; }
  pre { font-family: var(--mono); font-size: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; color: var(--text); }
  .json-key { color: #4ecdc4; } .json-str { color: #f9c87c; } .json-num { color: #79c7e3; } .json-bool { color: var(--danger); } .json-null { color: var(--muted); }
  .placeholder { color: var(--muted); font-size: 12px; text-align: center; margin-top: 40px; }
  .placeholder span { display: block; font-size: 28px; margin-bottom: 8px; opacity: 0.3; }
  .loading { color: var(--muted); font-size: 12px; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  ::-webkit-scrollbar { width: 4px; height: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>API Tester</h1>
  <span class="tag">Prog. Linear</span>
  <!-- <span class="mem-badge">⚡ SEM BANCO</span> -->
  <span class="mem-badge">⚡ COM BANCO</span>
  <div class="base-url-wrapper">
    <label>BASE URL</label>
    <input type="text" id="baseUrl" value="http://localhost:5000">
  </div>
</header>

<aside>
  <div class="section-label">Problemas</div>
  <button class="route-btn active" onclick="loadRoute(this,'GET','/problems',null,'Lista todos os problemas cadastrados em memória.')">
    <span class="method GET">GET</span>/problems
  </button>
  <button class="route-btn" onclick="loadRoute(this,'GET','/problems/{id}','id_only','Retorna o problema com suas variáveis e restrições.')">
    <span class="method GET">GET</span>/problems/{id}
  </button>
  <button class="route-btn" onclick="loadRoute(this,'POST','/problems/create','criar_completo','Cria o problema completo de uma vez: nome, objetivo, variáveis e restrições.')">
    <span class="method POST">POST</span>/problems/create
  </button>
  <button class="route-btn" onclick="loadRoute(this,'DELETE','/problems/{id}','id_only','Remove o problema e todos os dados vinculados da memória.')">
    <span class="method DELETE">DELETE</span>/problems/{id}
  </button>

  <div class="section-label">Resolver</div>
  <button class="route-btn" onclick="loadRoute(this,'POST','/problems/{id}/solve','id_only','Resolve o problema com PuLP. Salva o resultado em memória e marca como resolvido.')">
    <span class="method POST">POST</span>/problems/{id}/solve
  </button>
  <button class="route-btn" onclick="loadRoute(this,'GET','/problems/{id}/result','id_only','Retorna o último resultado do problema. 404 se ainda não foi resolvido.')">
    <span class="method GET">GET</span>/problems/{id}/result
  </button>
</aside>

<main>
  <div class="panel" id="requestPanel">
    <div class="panel-title">Request</div>
    <div class="request-line">
      <span class="req-method GET" id="methodBadge">GET</span>
      <input class="req-url" id="urlInput" type="text" value="/problems" readonly>
      <button class="send-btn" id="sendBtn" onclick="sendRequest()">Enviar</button>
    </div>
    <div class="desc-box" id="descBox">Lista todos os problemas cadastrados em memória.</div>
    <div id="paramsArea"></div>
    <div id="bodyArea"></div>
  </div>

  <div class="response-panel">
    <div class="response-header">
      <span class="panel-title">Response</span>
      <span class="status-badge" id="statusBadge"></span>
      <span class="response-time" id="responseTime"></span>
    </div>
    <div class="response-body">
      <div class="placeholder" id="placeholder"><span>⬆</span>Configure e envie uma requisição</div>
      <pre id="responseOutput" style="display:none"></pre>
    </div>
  </div>
</main>

<script>
const TEMPLATES = {
  id_only: { fields: ['id'], body: null },
  criar_completo: {
    fields: [],
    body: {
      nome: "Mix de Serviços TI",
      objetivo: "maximize",
      variaveis: [
        { nome: "Web",            coeficiente_objetivo: 20, unidade_medida: "contratos" },
        { nome: "Mobile",         coeficiente_objetivo: 25, unidade_medida: "contratos" },
        { nome: "Suporte",        coeficiente_objetivo: 10, unidade_medida: "contratos" },
        { nome: "Dados",          coeficiente_objetivo: 30, unidade_medida: "contratos" },
        { nome: "Ciberseguranca", coeficiente_objetivo: 35, unidade_medida: "contratos" }
      ],
      restricoes: [
        { nome: "Horas Dev",           operador: "<=", limite: 4000, coeficientes: [200, 250, 80, 300, 350] },
        { nome: "Horas Especialistas", operador: "<=", limite: 3000, coeficientes: [150, 180, 60, 250, 300] },
        { nome: "Orcamento Infra",     operador: "<=", limite: 500,  coeficientes: [20, 25, 10, 40, 50]    }
      ]
    }
  }
};

let currentMethod = 'GET';

function loadRoute(btn, method, path, template, desc) {
  document.querySelectorAll('.route-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMethod = method;

  const badge = document.getElementById('methodBadge');
  badge.textContent = method;
  badge.className = `req-method ${method}`;
  document.getElementById('descBox').textContent = desc;
  document.getElementById('paramsArea').innerHTML = '';
  document.getElementById('bodyArea').innerHTML = '';
  document.getElementById('responseOutput').style.display = 'none';
  document.getElementById('placeholder').style.display = 'block';
  document.getElementById('statusBadge').className = 'status-badge';
  document.getElementById('responseTime').textContent = '';

  const tmpl = template ? TEMPLATES[template] : null;

  if (tmpl?.fields?.length) {
    const div = document.createElement('div');
    div.className = 'field-group';
    div.innerHTML = `<label>PARÂMETROS DE URL</label><div class="field-row" id="paramFields"></div>`;
    document.getElementById('paramsArea').appendChild(div);
    tmpl.fields.forEach(f => {
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.placeholder = f === 'id' ? 'id do problema' : f;
      inp.id = `param_${f}`;
      inp.oninput = () => updateUrl(path, tmpl);
      document.getElementById('paramFields').appendChild(inp);
    });
  }

  if (tmpl?.body) {
    const div = document.createElement('div');
    div.className = 'field-group';
    div.innerHTML = `<label>BODY (JSON)</label>`;
    const ta = document.createElement('textarea');
    ta.id = 'bodyInput';
    ta.value = JSON.stringify(tmpl.body, null, 2);
    div.appendChild(ta);
    document.getElementById('bodyArea').appendChild(div);
  }

  updateUrl(path, tmpl);
}

function updateUrl(path, tmpl) {
  let url = path;
  if (tmpl?.fields) {
    tmpl.fields.forEach(f => {
      const el = document.getElementById(`param_${f}`);
      url = url.replace(`{${f}}`, el?.value || `{${f}}`);
    });
  }
  document.getElementById('urlInput').value = url;
}

async function sendRequest() {
  const base = document.getElementById('baseUrl').value.replace(/\/$/, '');
  const url = base + document.getElementById('urlInput').value;
  const btn = document.getElementById('sendBtn');
  const bodyEl = document.getElementById('bodyInput');

  let body = null;
  if (bodyEl) {
    try { body = JSON.parse(bodyEl.value); }
    catch { showResponse(null, 0, { erro: 'JSON inválido no body' }); return; }
  }

  btn.disabled = true; btn.textContent = '...';
  document.getElementById('placeholder').innerHTML = '<div class="loading">aguardando resposta...</div>';
  document.getElementById('placeholder').style.display = 'block';
  document.getElementById('responseOutput').style.display = 'none';

  const t0 = Date.now();
  try {
    const opts = { method: currentMethod, headers: { 'Content-Type': 'application/json' } };
    if (body && ['POST', 'PUT'].includes(currentMethod)) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    showResponse(res.status, Date.now() - t0, await res.json());
  } catch(e) {
    showResponse(null, Date.now() - t0, { erro: e.message });
  } finally {
    btn.disabled = false; btn.textContent = 'Enviar';
  }
}

function showResponse(status, elapsed, data) {
  document.getElementById('placeholder').style.display = 'none';
  const out = document.getElementById('responseOutput');
  out.style.display = 'block';
  const badge = document.getElementById('statusBadge');
  badge.textContent = status || 'ERRO';
  badge.className = `status-badge ${!status ? 'status-4xx' : status < 300 ? 'status-2xx' : 'status-4xx'}`;
  document.getElementById('responseTime').textContent = elapsed ? `${elapsed}ms` : '';
  out.innerHTML = highlight(JSON.stringify(data, null, 2));
}

function highlight(json) {
  return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m => {
      let c = 'json-num';
      if (/^"/.test(m)) c = /:$/.test(m) ? 'json-key' : 'json-str';
      else if (/true|false/.test(m)) c = 'json-bool';
      else if (/null/.test(m)) c = 'json-null';
      return `<span class="${c}">${m}</span>`;
    });
}

loadRoute(document.querySelector('.route-btn'), 'GET', '/problems', null, 'Lista todos os problemas cadastrados em memória.');
</script>
</body>
</html>
