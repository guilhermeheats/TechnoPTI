site_name: Technopti
site_description: Documentação do sistema de otimização de problemas de Programação Linear
site_author: Projeto Technopti
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: pt-BR
  logo: assets/img/logo.svg
  favicon: assets/img/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Início: index.md
  - Apresentação:
      - Visão geral: apresentacao.md
      - Roteiro em texto: roteiro-apresentacao.md
  - Documentação em PDF: documentacao-pdf.md
  - Projeto: projeto.md
  - Como executar: como-executar.md
  - Frontend: frontend.md
  - Backend e banco: backend.md
  - API REST: api.md
  - Modelo matemático: modelo-matematico.md
  - Estrutura: estrutura.md
  - Documentação (MkDocs): mkdocs.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: pt

extra_css:
  - stylesheets/extra.css

copyright: Technopti · Projeto de Programação Linear
extra:
  generator: false
