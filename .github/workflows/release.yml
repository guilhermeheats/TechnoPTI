name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release e artefatos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci
      - name: Build do frontend
        working-directory: frontend
        run: npm run build
      - name: Gerar artefatos
        run: |
          mkdir -p release
          TAG="${GITHUB_REF_NAME}"
          (cd frontend/dist && zip -r "../../release/technopti-frontend-${TAG}.zip" .)
          git archive --format=zip --output="release/technopti-source-${TAG}.zip" HEAD
      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          name: Technopti ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/technopti-frontend-*.zip
            release/technopti-source-*.zip

  package:
    name: Pacote GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Calcular nome da imagem
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
